bundle:
  name: music_popularity_spike_detection

variables:
  catalog_name:
    default: "dbr_dev"
  schema_name:
    default: "music_analytics"
  landing_zone_name:
    default: "landing_zone"
  existing_cluster_id:
    default: "0702-132442-toro5spu"
  secret_scope_val:
    default: "pawelnowak2004pri219_scope"
  secret_key_val:
    default: "pawelnowak-youtube-api"

resources:

  # schemas:
  #   dbr_schema:
  #     name: ${var.schema_name}
  #     catalog_name: ${var.catalog_name}

  # volumes:
  #   dbr_volume:
  #     name: ${var.landing_zone_name}
  #     catalog_name: ${var.catalog_name}
  #     schema_name: ${var.schema_name}

    
  # ----------------------------------------------------------------------------
  # A. DLT WORLD (Configured via spark.conf)
  # ----------------------------------------------------------------------------
  pipelines:
    music_dlt_pipeline:
      name: "Music Popularity Lakeflow Pipeline"
      continuous: false
      schema: ${var.schema_name}
      catalog: ${var.catalog_name}
      channel: "CURRENT"
      edition: "ADVANCED"
      
      # These values will be available in DLT via spark.conf.get()
      configuration:
        music.catalog: ${var.catalog_name}
        music.schema: ${var.schema_name}
        music.volume: ${var.landing_zone_name}
        music.secret_scope: ${var.secret_scope_val}
        music.secret_key: ${var.secret_key_val}
        bundle.root: ${workspace.file_path}/files

      libraries:
        - file:
            path: src/pipelines/01_bronze_ingestion.py
        - file:
            path: src/pipelines/02_silver_cleaning.py
        - file:
            path: src/pipelines/03_fact_video_metrics.py
        - file:
            path: src/pipelines/03_gold_metadata.py
        - file:
            path: src/pipelines/04_gold_aggregations.py

      clusters:
        - label: default
          node_type_id: "Standard_D4ds_v5"
          num_workers: 1

  # ----------------------------------------------------------------------------
  # B. JOBS WORLD (Configured via CLI arguments)
  # ----------------------------------------------------------------------------
  jobs:
    music_etl_orchestrator:
      name: "Full Music ETL Workflow"

      tasks:
        # Task 1: Environment Setup
        - task_key: setup_environment
          existing_cluster_id: ${var.existing_cluster_id}
          spark_python_task:
            python_file: src/setup/music_pipeline_setup.py
            parameters:
              - "--catalog"
              - "${var.catalog_name}"
              - "--schema"
              - "${var.schema_name}"
              - "--volume"
              - "${var.landing_zone_name}"
              - "--secret_scope"
              - "${var.secret_scope_val}"
              - "--secret_key"
              - "${var.secret_key_val}"

        # Task 2: API Producer (RECEIVES THE SAME PARAMETERS)
        - task_key: fetch_youtube_data
          depends_on:
            - task_key: setup_environment
          existing_cluster_id: ${var.existing_cluster_id}
          spark_python_task:
            python_file: src/producer/save_yt_stats_snapshot.py
            # Passing the same parameters to ensure setup import works without errors
            parameters:
              - "--catalog"
              - "${var.catalog_name}"
              - "--schema"
              - "${var.schema_name}"
              - "--volume"
              - "${var.landing_zone_name}"
              - "--secret_scope"
              - "${var.secret_scope_val}"
              - "--secret_key"
              - "${var.secret_key_val}"

        # TASK 3: Run DLT Pipeline
        - task_key: run_dlt_pipeline
          depends_on:
            - task_key: fetch_youtube_data
          pipeline_task:
            pipeline_id: ${resources.pipelines.music_dlt_pipeline.id}

# ------------------------------------------------------------------------------
# 3. TARGETS (DEV & PROD PRESETS)
# ------------------------------------------------------------------------------
targets:
  dev:
    default: true
    workspace:
      host: https://adb-7405604503619901.1.azuredatabricks.net
    presets:
      name_prefix: ''
      pipelines_development: true
      trigger_pause_status: "PAUSED"
    variables:
      catalog_name: "dbr_dev"

  prod:
    workspace:
      host: https://adb-7405604503619901.1.azuredatabricks.net
    presets:
      name_prefix: ''
      pipelines_development: false
      trigger_pause_status: "UNPAUSED"
    variables:
      catalog_name: "dbr_prod"