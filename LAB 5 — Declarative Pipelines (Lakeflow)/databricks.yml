# ==============================================================================
# DATABRICKS ASSET BUNDLES (DABs) CONFIGURATION - LAB 5
# Music Popularity Spike Detection System (YouTube & DLT Pipeline)
# ==============================================================================
bundle:
  name: music_popularity_spike_detection

# ------------------------------------------------------------------------------
# 1. ENVIRONMENT VARIABLES (UNITY CATALOG & COMPUTE)
# ------------------------------------------------------------------------------
variables:
  catalog_name:
    description: "Target Unity Catalog name (e.g. dbr_dev / dbr_prod)"
    default: "dbr_dev"
  schema_name:
    description: "Target schema for pipeline tables"
    default: "music_analytics"
  landing_zone_name:
    description: "Volume name for raw JSON payloads and metadata"
    default: "landing_zone"
  existing_cluster_id:
    description: "Cluster ID for existing student compute (Student_cluster / pnowak_cluster)"
    default: "0702-132442-toro5spu"

# ------------------------------------------------------------------------------
# 2. RESOURCES (DLT PIPELINE & MULTI-TASK WORKFLOW ORCHESTRATOR)
# ------------------------------------------------------------------------------
resources:

  # ----------------------------------------------------------------------------
  # A. Lakeflow Spark Declarative Pipeline (Delta Live Tables)
  # ----------------------------------------------------------------------------
  pipelines:
    music_dlt_pipeline:
      name: "[${bundle.target}] Music Popularity Lakeflow Pipeline"
      catalog: ${var.catalog_name}
      target: ${var.schema_name}

      # Cost optimization settings (FinOps)
      continuous: false                 # Triggered mode: runs once and stops
      photon: false                     # Disable Photon to avoid extra DBU charges
      serverless: false                 # Use standard pool/cluster instead of expensive serverless
      edition: "PRO"                    # Required for data quality expectations (@dlt.expect)
      channel: "CURRENT"

      # Pass Unity Catalog paths to Spark session (spark.conf.get)
      configuration:
        music_project.catalog_name: ${var.catalog_name}
        music_project.schema_name: ${var.schema_name}
        music_project.volume_name: ${var.landing_zone_name}

      # Medallion layer entrypoints
      libraries:
        - file:
            path: src/pipelines/01_bronze_ingestion.py
        - file:
            path: src/pipelines/02_silver_cleaning.py
        - file:
            path: src/pipelines/03_gold_aggregations.py

      # Dedicated single-worker node for DLT
      clusters:
        - label: default
          node_type_id: "Standard_D4ds_v5"
          num_workers: 1
          autoscale:
            min_workers: 1
            max_workers: 1
            mode: ENHANCED

  # ----------------------------------------------------------------------------
  # B. Workflow Orchestrator (Multi-Task Job DAG)
  # ----------------------------------------------------------------------------
  jobs:
    music_etl_orchestrator:
      name: "[${bundle.target}] Full Music ETL Workflow"

      tasks:
        # STEP 1: Environment Setup (Schemas, Volumes, Seed Data)
        - task_key: setup_environment
          existing_cluster_id: ${var.existing_cluster_id}
          spark_python_task:
            python_file: src/setup/music_pipeline_setup.py

        # STEP 2: Fetch raw JSON snapshots from YouTube API to Landing Zone Volume
        - task_key: fetch_youtube_data
          depends_on:
            - task_key: setup_environment
          existing_cluster_id: ${var.existing_cluster_id}
          spark_python_task:
            python_file: src/producer/save_yt_stats_snapshot.py

        # STEP 3: Execute Declarative DLT Pipeline (Bronze -> Silver -> Gold)
        - task_key: run_dlt_pipeline
          depends_on:
            - task_key: fetch_youtube_data
          pipeline_task:
            pipeline_id: ${resources.pipelines.music_dlt_pipeline.id}

# ------------------------------------------------------------------------------
# 3. DEPLOYMENT TARGETS (DEV / PROD)
# ------------------------------------------------------------------------------
targets:
  dev:
    default: true
    mode: development
    variables:
      catalog_name: "dbr_dev"
      schema_name: "music_analytics"
      landing_zone_name: "landing_zone"
      existing_cluster_id: ${var.existing_cluster_id}

  prod:
    mode: production
    variables:
      catalog_name: "dbr_prod"
      schema_name: "music_analytics"
      landing_zone_name: "landing_zone"
      existing_cluster_id: ${var.existing_cluster_id} 