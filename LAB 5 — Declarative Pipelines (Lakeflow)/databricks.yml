# ==============================================================================
# DATABRICKS ASSET BUNDLES (DABs) - LAB 5
# Music Popularity Spike Detection System
# ==============================================================================
bundle:
  name: music_popularity_spike_detection

# ------------------------------------------------------------------------------
# 1. GLOBAL VARIABLES
# ------------------------------------------------------------------------------
variables:
  catalog_name:
    description: "Target Unity Catalog name"
    default: "dbr_dev"
  schema_name:
    description: "Target schema for tables"
    default: "music_analytics"
  landing_zone_name:
    description: "Volume name for raw data landing zone"
    default: "landing_zone"
  existing_cluster_id:
    description: "Cluster ID for existing compute (Student_cluster / pnowak_cluster)"
    default: "0702-132442-toro5spu"
  secret_scope_val:
    description: "Databricks secret scope"
    default: "pawelnowak2004pri219_scope"
  secret_key_val:
    description: "Databricks secret key for the API"
    default: "pawelnowak-youtube-api"

# ------------------------------------------------------------------------------
# 2. RESOURCES (DLT PIPELINE & ORCHESTRATOR JOB)
# ------------------------------------------------------------------------------
resources:

  # ----------------------------------------------------------------------------
  # A. Declarative Lakeflow Pipeline (DLT)
  # ----------------------------------------------------------------------------
  pipelines:
    music_dlt_pipeline:
      name: "Music Popularity Lakeflow Pipeline"
      catalog: ${var.catalog_name}
      target: ${var.schema_name}

      continuous: false
      photon: false
      serverless: false
      edition: "PRO"
      channel: "CURRENT"

      configuration:
        music_project.catalog_name: ${var.catalog_name}
        music_project.schema_name: ${var.schema_name}
        music_project.volume_name: ${var.landing_zone_name}
        secret_scope_val: ${var.secret_scope_val}
        secret_key_val: ${var.secret_key_val}
        bundle_root: ${workspace.file_path}/files

      libraries:
        - file:
            path: src/pipelines/01_bronze_ingestion.py
        - file:
            path: src/pipelines/02_silver_cleaning.py
        - file:
            path: src/pipelines/03_gold_aggregations.py

      clusters:
        - label: default
          node_type_id: "Standard_D4ds_v5"
          num_workers: 1
          autoscale:
            min_workers: 1
            max_workers: 1
            mode: ENHANCED

  # ----------------------------------------------------------------------------
  # B. Workflow Orchestrator Job
  # ----------------------------------------------------------------------------
  jobs:
    music_etl_orchestrator:
      name: "Full Music ETL Workflow"

      tasks:
        # Task 1: Environment Setup
        - task_key: setup_environment
          existing_cluster_id: ${var.existing_cluster_id}
          spark_python_task:
            python_file: src/setup/music_pipeline_setup.py
            base_parameters:
              - "${var.catalog_name}"
              - "${var.schema_name}"
              - "${var.landing_zone_name}"
              - "${var.secret_scope_val}"
              - "${var.secret_key_val}"

        # Task 2: API Producer
        - task_key: fetch_youtube_data
          depends_on:
            - task_key: setup_environment
          existing_cluster_id: ${var.existing_cluster_id}
          spark_python_task:
            python_file: src/producer/save_yt_stats_snapshot.py

        # Task 3: DLT Pipeline
        - task_key: run_dlt_pipeline
          depends_on:
            - task_key: fetch_youtube_data
          pipeline_task:
            pipeline_id: ${resources.pipelines.music_dlt_pipeline.id}

# ------------------------------------------------------------------------------
# 3. TARGETS (DEV & PROD PRESETS)
# ------------------------------------------------------------------------------
targets:
  dev:
    default: true
    workspace:
      host: https://adb-7405604503619901.1.azuredatabricks.net
    presets:
      name_prefix: ''
      pipelines_development: true
      trigger_pause_status: "PAUSED"
    variables:
      catalog_name: "dbr_dev"
      schema_name: "music_analytics"
      landing_zone_name: "landing_zone"

  prod:
    workspace:
      host: https://adb-7405604503619901.1.azuredatabricks.net
    presets:
      name_prefix: ''
      pipelines_development: false
      trigger_pause_status: "UNPAUSED"
    variables:
      catalog_name: "dbr_prod"
      schema_name: "music_analytics"
      landing_zone_name: "landing_zone"
