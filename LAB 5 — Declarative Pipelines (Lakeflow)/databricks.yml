# ==============================================================================
# DATABRICKS ASSET BUNDLES (DABs) — LAB 5
# System detekcji skoków popularności muzyki na YouTube
# ==============================================================================

bundle:
  name: music_popularity_spike_detection

# ------------------------------------------------------------------------------
# 1. ZMIENNE GLOBALNE ŚRODOWISKA
# ------------------------------------------------------------------------------
variables:
  catalog_name:
    description: "Katalog w Unity Catalog"
    default: "dbr_dev"
  schema_name:
    description: "Schemat bazy danych dla tabel"
    default: "music_analytics"
  landing_zone_name:
    description: "Nazwa wolumenu Unity Catalog"
    default: "landing_zone"

# ------------------------------------------------------------------------------
# 2. ŚRODOWISKA (TARGETS)
# ------------------------------------------------------------------------------
targets:
  dev:
    default: true
    workspace:
      host: https://adb-7405604503619901.1.azuredatabricks.net
    presets:
      name_prefix: ''

# ------------------------------------------------------------------------------
# 3. ZASOBY (Orkiestracja i Pipeline)
# ------------------------------------------------------------------------------
resources:
  
  # A. DEKLARATYWNY POTOK DLT (Lakeflow)
  pipelines:
    music_dlt_pipeline:
      name: "Music Popularity DLT Pipeline"
      catalog: ${var.catalog_name}
      schema: ${var.schema_name}
      continuous: false
      
      libraries:
        - file:
            path: src/pipelines/01_bronze_ingestion.py
        - file:
            path: src/pipelines/02_silver_cleaning.py
        - file:
            path: src/pipelines/03_gold_aggregations.py
            
      configuration:
        music_project.catalog_name: ${var.catalog_name}
        music_project.schema_name: ${var.schema_name}
        music_project.volume_name: ${var.landing_zone_name}

  # B. ORKIESTRATOR (DATABRICKS JOB)
  jobs:
    music_etl_orchestrator:
      name: "Full Music ETL Workflow"
      
      tasks:
        # TASK 0: Inicjalizacja infrastruktury (Tworzy Katalog, Schemat i Wolumen)
        - task_key: setup_infrastructure
          job_cluster_key: shared_job_cluster
          spark_python_task:
            python_file: src/setup/run_setup.py
          libraries:
            - pypi:
                package: databricks-sdk>=0.28.0
            
        # TASK 1: Pobieranie danych (Musi czekać na setup_infrastructure!)
        - task_key: fetch_youtube_data
          depends_on:
            - task_key: setup_infrastructure
          job_cluster_key: shared_job_cluster
          spark_python_task:
            python_file: src/producer/save_yt_stats_snapshot.py
          libraries:
            - pypi:
                package: databricks-sdk>=0.28.0
            
        # TASK 2: Uruchomienie potoku DLT (Musi czekać na producenta)
        - task_key: run_dlt_pipeline
          depends_on:
            - task_key: fetch_youtube_data
          pipeline_task:
            pipeline_id: ${resources.pipelines.music_dlt_pipeline.id}

      job_clusters:
        - job_cluster_key: shared_job_cluster
          new_cluster:
            spark_version: 14.3.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 1
            data_security_mode: SINGLE_USER
            spark_conf:
              music_project.catalog_name: ${var.catalog_name}
              music_project.schema_name: ${var.schema_name}
              music_project.volume_name: ${var.landing_zone_name}
            spark_env_vars:
              YT_API_KEY: "{{secrets/pawelnowak2004pri219_scope/pawelnowak-youtube-api}}"