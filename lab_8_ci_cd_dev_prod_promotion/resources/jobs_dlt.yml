resources:
  # ----------------------------------------------------------------------------
  # A. DLT WORLD (Configured via spark.conf)
  # ----------------------------------------------------------------------------
  pipelines:
    music_dlt_pipeline:
      name: "[${bundle.target}] Music Popularity Lakeflow Pipeline"
      continuous: false
      target: ${var.schema_name}
      catalog: ${var.catalog_name}
      channel: "CURRENT"
      edition: "ADVANCED"
      photon: false
      serverless: false

      # Values available in DLT via spark.conf.get()
      configuration:
        music.catalog: ${var.catalog_name}
        music.schema: ${var.schema_name}
        music.volume: ${var.landing_zone_name}
        music.secret_scope: ${var.secret_scope_val}
        music.secret_key: ${var.secret_key_val}
        bundle.root: ${workspace.file_path}/files


      libraries:
        - file:
            path: src/pipelines/01_bronze_ingestion.py
        - file:
            path: src/pipelines/02_silver_cleaning.py
        - file:
            path: src/pipelines/03_fact_video_metrics.py
        - file:
            path: src/pipelines/03_gold_metadata.py
        - file:
            path: src/pipelines/04_gold_aggregations.py

      clusters:
        - label: default
          node_type_id: "Standard_D4ds_v5"
          num_workers: 1
          custom_tags:
            ResourceClass: "SingleNode"
          spark_conf:
            spark.master: "local[*]"
            spark.databricks.cluster.profile: "singleNode"

  # ----------------------------------------------------------------------------
  # B. JOBS WORLD (Configured via CLI arguments)
  # ----------------------------------------------------------------------------
  jobs:
    music_etl_orchestrator:
      name: "[${bundle.target}] Full Music ETL Workflow"

      tasks:
        # Task 1: Environment Setup
        - task_key: setup_environment
          existing_cluster_id: ${var.existing_cluster_id}
          spark_python_task:
            python_file: src/setup/music_pipeline_setup.py
            parameters:
              - "--catalog"
              - "${var.catalog_name}"
              - "--schema"
              - "${var.schema_name}"
              - "--volume"
              - "${var.landing_zone_name}"
              - "--secret_scope"
              - "${var.secret_scope_val}"
              - "--secret_key"
              - "${var.secret_key_val}"

        # Task 2: API Producer
        - task_key: fetch_youtube_data
          depends_on:
            - task_key: setup_environment
          existing_cluster_id: ${var.existing_cluster_id}
          spark_python_task:
            python_file: src/producer/save_yt_stats_snapshot.py
            parameters:
              - "--catalog"
              - "${var.catalog_name}"
              - "--schema"
              - "${var.schema_name}"
              - "--volume"
              - "${var.landing_zone_name}"
              - "--secret_scope"
              - "${var.secret_scope_val}"
              - "--secret_key"
              - "${var.secret_key_val}"

        # Task 3: Run DLT Pipeline
        - task_key: run_dlt_pipeline
          depends_on:
            - task_key: fetch_youtube_data
          pipeline_task:
            pipeline_id: ${resources.pipelines.music_dlt_pipeline.id}

        # Task 4: Automated Data Quality & Reconciliation Gate
        - task_key: reconciliation_gate
          depends_on:
            - task_key: run_dlt_pipeline
              
          email_notifications: # When the job fails (due to bad quality data, a notification is sent)
            on_failure:
              - "my_email@2137.pl"
        
          existing_cluster_id: ${var.existing_cluster_id}
          spark_python_task:
            python_file: src/quality/reconciliation_gate.py
            parameters:
              - "--catalog"
              - "${var.catalog_name}"
              - "--schema"
              - "${var.schema_name}"
              - "--volume"
              - "${var.landing_zone_name}"