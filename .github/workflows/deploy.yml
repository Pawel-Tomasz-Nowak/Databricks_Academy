name: CI/CD Pipeline - Databricks Asset Bundles

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate_and_test:
    name: CI - Test & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyspark chispa

      - name: Run unit tests
        working-directory: ./lab_8_ci_cd_dev_prod_promotion
        run: |
          pytest tests/test_aggregate_stats.py tests/test_aggregate_video_stats.py

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Databricks Asset Bundle (DEV)
        working-directory: ./lab_8_ci_cd_dev_prod_promotion
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle validate -t dev

  deploy_to_prod:
    name: CD - Deploy to PROD & Run
    needs: validate_and_test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy bundle to PROD
        working-directory: ./lab_8_ci_cd_dev_prod_promotion
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle deploy -t prod

      - name: Run Production ETL Orchestrator
        working-directory: ./lab_8_ci_cd_dev_prod_promotion
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle run music_etl_orchestrator -t prod